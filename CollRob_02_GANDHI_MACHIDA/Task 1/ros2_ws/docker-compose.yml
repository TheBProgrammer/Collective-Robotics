services:
  ros2_jazzy:
    build: .

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

    # Shared memory for Gazebo / RViz.
    shm_size: 512m

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/root/ros2_ws/src:rw
      - ./scripts:/root/ros2_ws/scripts:rw
      - ./results:/root/ros2_ws/results:rw

    # Hardware-accelerated GUI on Intel/AMD via DRI.
    devices:
      - /dev/dri:/dev/dri

    stdin_open: true
    tty: true

    network_mode: host
